name: Build Windows portable artifact

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./server[dev,build]" platformio==6.1.19
      - run: python -m platformio run -d hardware/ble_bridge
      - run: python -m platformio run -d hardware/usb_bridge
      - run: python scripts/build_portable.py --output dist/windows-ci
      - run: Expand-Archive -LiteralPath dist/windows-ci/esp32-android-agent-0.1.0-windows-x64.zip -DestinationPath 'dist/便携 验收'
      - run: python scripts/smoke_portable.py 'dist/便携 验收/esp32-android-agent/esp32-android-agent.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: |
            dist/windows-ci/*.zip
            dist/windows-ci/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
