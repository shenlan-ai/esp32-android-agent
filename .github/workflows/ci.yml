name: Continuous validation

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec@1.13.1
      - run: python -m pip install -e "./server[dev]"
      - run: openspec validate --all --strict --no-interactive
      - run: openspec validate --archived --no-interactive
      - id: base
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/ci_base.py --event "$CI_EVENT_NAME"
      - env:
          CI_BASE_SHA: ${{ steps.base.outputs.base }}
        run: python scripts/check_changes.py --base "$CI_BASE_SHA"
      - run: python scripts/check_workflows.py

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./server[dev]"
      - run: python -m ruff check --config server/pyproject.toml server scripts tools packaging
      - run: python -m pytest -q server/tests
      - run: python -m unittest discover -s scripts/tests -p test_ci_base.py

  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test server/tests/geometry.test.mjs server/tests/board-status.test.mjs

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: hardware/ble_bridge
            profile: esp32dev
          - directory: hardware/usb_bridge
            profile: esp32_s3_devkitc
          - directory: hardware/usb_bridge
            profile: xiao_esp32s3
          - directory: hardware/usb_bridge
            profile: esp32_s3_zero
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.19 -e "./server[dev]"
      - env:
          FIRMWARE_DIR: ${{ matrix.directory }}
          FIRMWARE_PROFILE: ${{ matrix.profile }}
        run: python -m platformio run -d "$FIRMWARE_DIR" -e "$FIRMWARE_PROFILE"
      - if: matrix.profile == 'esp32dev'
        run: g++ --version
      - if: matrix.profile == 'esp32dev'
        run: python -c "from pathlib import Path; assert Path('hardware/ble_bridge/.pio/libdeps/esp32dev/ArduinoJson/src').is_dir(), 'Native firmware tests require ArduinoJson'"
      - if: matrix.profile == 'esp32dev'
        run: python -m unittest discover -s scripts/tests
