[env]
platform = espressif32@6.12.0
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.2
build_unflags = -DARDUINO_USB_MODE=1 -DBOARD_HAS_PSRAM
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -I../ble_bridge/include

[env:esp32_s3_devkitc]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -DAGENT_BOARD_PROFILE=\"esp32_s3_devkitc_n8\"

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -DAGENT_BOARD_PROFILE=\"xiao_esp32s3\"

[env:esp32_s3_zero]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DAGENT_BOARD_PROFILE=\"esp32_s3_zero_4mb\"
